<mdc-tooltip-box placement="top" caret>
    <mdc-button variant="filled"><span>Plain with Caret (Top)</span></mdc-button>
    <mdc-tooltip slot="tooltip">Add to favorites</mdc-tooltip>
</mdc-tooltip-box>

<mdc-tooltip-box placement="bottom" caret>
    <mdc-button variant="outlined"><span>Plain with Caret (Bottom)</span></mdc-button>
    <mdc-tooltip slot="tooltip">Share this item</mdc-tooltip>
</mdc-tooltip-box>

<mdc-tooltip-box placement="bottom" caret persistent trigger="click">
    <mdc-button variant="tonal"><span>Rich Persistent with Caret (Click)</span></mdc-button>
    <mdc-tooltip slot="tooltip" rich>
        <span slot="headline">Permissions updated</span>
        <span>Anyone with the link can now view and comment on this file.</span>
        <mdc-button slot="actions" variant="text"><span>Learn more</span></mdc-button>
    </mdc-tooltip>
</mdc-tooltip-box>
