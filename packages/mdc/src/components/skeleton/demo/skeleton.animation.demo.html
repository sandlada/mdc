<div style="display: grid; gap: 16px; width: 100%; max-width: 360px;">
    <div>
        <div style="margin-bottom: 6px; font-size: 12px; opacity: 0.72;">Shimmer (Default)</div>
        <mdc-skeleton variant="rounded" animation="shimmer" height="56px"></mdc-skeleton>
    </div>
    <div>
        <div style="margin-bottom: 6px; font-size: 12px; opacity: 0.72;">Pulse</div>
        <mdc-skeleton variant="rounded" animation="pulse" height="56px"></mdc-skeleton>
    </div>
    <div>
        <div style="margin-bottom: 6px; font-size: 12px; opacity: 0.72;">None (Static)</div>
        <mdc-skeleton variant="rounded" animation="none" height="56px"></mdc-skeleton>
    </div>
</div>
