<div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-tab-badge-live').badge = ''">None</mdc-button>
        <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-tab-badge-live').badge = '3'">3</mdc-button>
        <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-tab-badge-live').badge = '99+'">99+</mdc-button>
        <mdc-button variant="tonal" onclick="const t = this.getRootNode().querySelector('#demo-tab-badge-live'); t.badge = t.badge ? '' : '3';">Toggle Badge</mdc-button>
        <mdc-button variant="tonal" onclick="const t = this.getRootNode().querySelector('#demo-tab-badge-live'); t.checked = !t.checked;">Toggle Checked</mdc-button>
        <mdc-button variant="tonal" onclick="const t = this.getRootNode().querySelector('#demo-tab-badge-live'); t.variant = t.variant === 'rail-horizontal' ? 'bar-vertical' : 'rail-horizontal';">Toggle Layout</mdc-button>
    </div>

    <div style="display: flex; gap: 16px; align-items: center;">
        <mdc-navigation-tab id="demo-tab-badge-live" name="demo-badge" value="/1" label="Inbox" badge="3" checked>
            <mdc-icon slot="icon">inbox</mdc-icon>
        </mdc-navigation-tab>
    </div>
</div>
