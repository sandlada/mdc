<div style="display: flex; gap: 32px; align-items: flex-start;">
    <mdc-navigation-rail style="height: 400px;">
        <mdc-icon-button slot="menu" onclick="const rail = this.closest('mdc-navigation-rail'); rail.toggle(); this.querySelector('mdc-icon').textContent = rail.expanded ? 'menu_open' : 'menu';">
            <mdc-icon>menu</mdc-icon>
        </mdc-icon-button>
        <mdc-navigation-tab name="rail-end-1" value="/home" label="Home" checked>
            <mdc-icon slot="inactive-icon">home</mdc-icon>
            <mdc-icon slot="active-icon" filled>home</mdc-icon>
        </mdc-navigation-tab>
        <mdc-navigation-tab name="rail-end-1" value="/search" label="Search">
            <mdc-icon slot="inactive-icon">search</mdc-icon>
            <mdc-icon slot="active-icon" filled>search</mdc-icon>
        </mdc-navigation-tab>
        <mdc-icon-button slot="end"><mdc-icon>settings</mdc-icon></mdc-icon-button>
    </mdc-navigation-rail>

    <mdc-navigation-rail expanded style="height: 400px;">
        <mdc-icon-button slot="menu" onclick="const rail = this.closest('mdc-navigation-rail'); rail.toggle(); this.querySelector('mdc-icon').textContent = rail.expanded ? 'menu_open' : 'menu';">
            <mdc-icon>menu_open</mdc-icon>
        </mdc-icon-button>
        <mdc-navigation-tab name="rail-end-2" value="/home" label="Home" checked>
            <mdc-icon slot="inactive-icon">home</mdc-icon>
            <mdc-icon slot="active-icon" filled>home</mdc-icon>
        </mdc-navigation-tab>
        <mdc-navigation-tab name="rail-end-2" value="/search" label="Search">
            <mdc-icon slot="inactive-icon">search</mdc-icon>
            <mdc-icon slot="active-icon" filled>search</mdc-icon>
        </mdc-navigation-tab>
        <mdc-icon-button slot="end"><mdc-icon>settings</mdc-icon></mdc-icon-button>
    </mdc-navigation-rail>
</div>
