<style>
    .cdp-card {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 180px;
        width: 100%;
        padding: 8px;
        font: 500 14px/20px var(--md-ref-typeface-font-plain, 'Noto Sans', system-ui, sans-serif);
        color: var(--md-sys-color-on-surface, #1d1b20);
    }
    .cdp-a { background: var(--md-sys-color-surface-container-high, #e6e0e9); }
    .cdp-b { background: var(--md-sys-color-secondary-container, #e8def8); }
    .cdp-c { background: var(--md-sys-color-tertiary-container, #ffd8e4); }
</style>

<!-- preferred-item-width tunes the target large item width; keylines adapt to container width -->
<mdc-carousel preferred-item-width="140" aria-label="140px preferred width">
    <mdc-carousel-item><div class="cdp-card cdp-a">01</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-b">02</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-c">03</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-a">04</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-b">05</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-c">06</div></mdc-carousel-item>
</mdc-carousel>

<!-- default preferred-item-width (186) -->
<mdc-carousel aria-label="Default 186px preferred width">
    <mdc-carousel-item><div class="cdp-card cdp-a">01</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-b">02</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-c">03</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-a">04</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-b">05</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-c">06</div></mdc-carousel-item>
</mdc-carousel>

<!-- larger preferred width → fewer, wider large items -->
<mdc-carousel preferred-item-width="260" aria-label="260px preferred width">
    <mdc-carousel-item><div class="cdp-card cdp-a">01</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-b">02</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-c">03</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-a">04</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-b">05</div></mdc-carousel-item>
    <mdc-carousel-item><div class="cdp-card cdp-c">06</div></mdc-carousel-item>
</mdc-carousel>
