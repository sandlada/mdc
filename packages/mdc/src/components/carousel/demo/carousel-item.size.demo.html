<style>
    .cds-card {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 180px;
        width: 100%;
        padding: 8px;
        font: 500 14px/20px var(--md-ref-typeface-font-plain, 'Noto Sans', system-ui, sans-serif);
        color: var(--md-sys-color-on-surface, #1d1b20);
    }
    .cds-a { background: var(--md-sys-color-surface-container-high, #e6e0e9); }
    .cds-b { background: var(--md-sys-color-secondary-container, #e8def8); }
    .cds-c { background: var(--md-sys-color-tertiary-container, #ffd8e4); }
</style>

<!-- Scroll or drag horizontally: each item's size attribute, width, corner radius, and caption opacity morph dynamically -->
<mdc-carousel aria-label="Dynamic item sizing and caption fade">
    <mdc-carousel-item><div class="cds-card cds-a"></div><span slot="caption">First Item</span></mdc-carousel-item>
    <mdc-carousel-item><div class="cds-card cds-b"></div><span slot="caption">Second Item</span></mdc-carousel-item>
    <mdc-carousel-item><div class="cds-card cds-c"></div><span slot="caption">Third Item</span></mdc-carousel-item>
    <mdc-carousel-item><div class="cds-card cds-a"></div><span slot="caption">Fourth Item</span></mdc-carousel-item>
    <mdc-carousel-item><div class="cds-card cds-b"></div><span slot="caption">Fifth Item</span></mdc-carousel-item>
    <mdc-carousel-item><div class="cds-card cds-c"></div><span slot="caption">Sixth Item</span></mdc-carousel-item>
</mdc-carousel>
