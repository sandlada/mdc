<!-- Bottom App Bar with Embedded FAB -->
<mdc-bottom-appbar label="Document actions" style="margin-bottom: 24px;">
    <mdc-icon-button aria-label="Check"><mdc-icon>check</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Edit"><mdc-icon>edit</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Mic"><mdc-icon>mic</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Image"><mdc-icon>image</mdc-icon></mdc-icon-button>
    <mdc-fab slot="fab" open variant="tonal-secondary">
        <mdc-icon slot="icon">add</mdc-icon>
    </mdc-fab>
</mdc-bottom-appbar>

<!-- Actions-only Bottom App Bar -->
<mdc-bottom-appbar label="Media actions">
    <mdc-icon-button aria-label="Menu"><mdc-icon>menu</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Search"><mdc-icon>search</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Archive"><mdc-icon>archive</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Delete"><mdc-icon>delete</mdc-icon></mdc-icon-button>
</mdc-bottom-appbar>
