<mdc-bottom-sheet id="bs-focus-trap-false" variant="modal" no-focus-trap open>
    <span slot="headline">Focus trap enabled (default)</span>
    <p>Tab cycles within the sheet. Try tabbing from the close button.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-focus-trap-true" variant="modal" open>
    <span slot="headline">Focus trap disabled</span>
    <p>Tab leaves the sheet and moves to the page.</p>
</mdc-bottom-sheet>
