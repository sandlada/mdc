<mdc-bottom-sheet id="bs-draggable-true" variant="modal" detent="peek" draggable>
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Draggable (true, default)</h2>
    <p>Drag the handle downward — past the 25% threshold or with enough velocity — to close. Otherwise it snaps back to <code>peek</code>.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-draggable-false" variant="modal" detent="peek" draggable="false">
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Not draggable (false)</h2>
    <p>Swipe gestures are ignored. Use Esc, scrim tap, or set a return value via <code>close()</code>.</p>
</mdc-bottom-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#bs-draggable-true').show()"><span>Draggable</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#bs-draggable-false').show()"><span>Static</span></mdc-button>
