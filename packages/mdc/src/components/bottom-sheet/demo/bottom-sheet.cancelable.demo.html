<mdc-bottom-sheet id="bs-cancelable-true" variant="modal" cancelable>
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Cancelable (true)</h2>
    <p>Esc and outside-tap (scrim) dismiss the sheet.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-cancelable-false" variant="modal" cancelable="false">
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Not cancelable (false)</h2>
    <p>Esc and scrim taps are ignored. Use <code>close()</code> from the parent.</p>
</mdc-bottom-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#bs-cancelable-true').show()"><span>Cancelable</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#bs-cancelable-false').show()"><span>Not cancelable</span></mdc-button>
