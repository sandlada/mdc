<mdc-bottom-sheet id="bs-open-imperative" variant="modal">
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Opened via show()</h2>
    <p>Imperative: <code>sheet.show()</code> sets <code>open</code> and promotes the dialog to the top layer.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-open-declarative" variant="modal" open>
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Opened via the open property</h2>
    <p>Declarative: setting <code>open = true</code> (or the <code>open</code> attribute) drives the same lifecycle.</p>
</mdc-bottom-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#bs-open-imperative').show()"><span>show()</span></mdc-button>
