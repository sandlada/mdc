<mdc-bottom-sheet id="bs-detent-peek" variant="modal" detent="peek" open>
    <span slot="headline">Peek detent</span>
    <p>Default height ~40vh. Drag the sheet upward to expand (or call setDetent).</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-detent-full" variant="modal" detent="full" open>
    <span slot="headline">Full detent</span>
    <p>Maximum height ~96vh. Drag downward to peek or close.</p>
</mdc-bottom-sheet>
