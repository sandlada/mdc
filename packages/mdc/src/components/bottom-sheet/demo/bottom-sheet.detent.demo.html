<mdc-bottom-sheet id="bs-detent-peek" variant="modal" detent="peek">
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Peek detent</h2>
    <p>Default height ~40vh. Drag the handle downward to dismiss, or set <code>detent="full"</code> to expand.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-detent-full" variant="modal" detent="full">
    <h2 style="margin: 0 0 8px 0; font: var(--mdc-typescale-title-medium);">Full detent</h2>
    <p>Maximum height ~96vh. Drag the handle downward to peek or close.</p>
</mdc-bottom-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#bs-detent-peek').show()"><span>Peek</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#bs-detent-full').show()"><span>Full</span></mdc-button>
