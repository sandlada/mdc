<mdc-bottom-sheet id="bs-headline-yes" variant="modal">
    <span slot="headline">With headline</span>
    <p>The headline slot fills the top row.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-headline-no" variant="modal">
    <p>No headline slot provided — the header row is collapsed.</p>
</mdc-bottom-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#bs-headline-yes').show()"><span>With headline</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#bs-headline-no').show()"><span>Without headline</span></mdc-button>
