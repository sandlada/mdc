<mdc-bottom-sheet id="bs-maxheight-0" variant="modal" max-height="0">
    <span slot="headline">No max-height cap</span>
    <p>Container height driven by detent + content.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-maxheight-400" variant="modal" max-height="400">
    <span slot="headline">max-height: 400px</span>
    <p>Hard ceiling — sheet cannot grow past 400px.</p>
</mdc-bottom-sheet>

<mdc-bottom-sheet id="bs-maxheight-800" variant="modal" max-height="800">
    <span slot="headline">max-height: 800px</span>
    <p>Hard ceiling at 800px.</p>
</mdc-bottom-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#bs-maxheight-0').show()"><span>No cap</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#bs-maxheight-400').show()"><span>400px</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#bs-maxheight-800').show()"><span>800px</span></mdc-button>
