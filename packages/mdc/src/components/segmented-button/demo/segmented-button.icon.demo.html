<mdc-segmented-button-set>
    <mdc-segmented-button>
        <mdc-icon slot="icon" name="list"></mdc-icon>
        List
    </mdc-segmented-button>
    <mdc-segmented-button selected>
        <mdc-icon slot="icon" name="grid_view"></mdc-icon>
        Grid
    </mdc-segmented-button>
    <mdc-segmented-button>
        <mdc-icon slot="icon" name="table_rows"></mdc-icon>
        Table
    </mdc-segmented-button>
</mdc-segmented-button-set>

<!-- Icon-only segments: when selected, the checkmark is drawn beside the icon. -->
<mdc-segmented-button-set>
    <mdc-segmented-button selected>
        <mdc-icon slot="icon" name="favorite"></mdc-icon>
    </mdc-segmented-button>
    <mdc-segmented-button>
        <mdc-icon slot="icon" name="favorite_border"></mdc-icon>
    </mdc-segmented-button>
    <mdc-segmented-button>
        <mdc-icon slot="icon" name="favorite"></mdc-icon>
    </mdc-segmented-button>
</mdc-segmented-button-set>

<!-- Icon + label, with the checkmark suppressed. -->
<mdc-segmented-button-set>
    <mdc-segmented-button no-checkmark selected>
        <mdc-icon slot="icon" name="format_bold"></mdc-icon>
        Bold
    </mdc-segmented-button>
    <mdc-segmented-button>
        <mdc-icon slot="icon" name="format_italic"></mdc-icon>
        Italic
    </mdc-segmented-button>
    <mdc-segmented-button>
        <mdc-icon slot="icon" name="format_underlined"></mdc-icon>
        Underline
    </mdc-segmented-button>
</mdc-segmented-button-set>
