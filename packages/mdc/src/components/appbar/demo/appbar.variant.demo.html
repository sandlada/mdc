<div style="display: flex; flex-direction: column; gap: 24px; width: 100%;">
    <!-- Interactive WAAPI Variant Switcher -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-variant-live').variant = 'small'"><span>Small</span></mdc-button>
            <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-variant-live').variant = 'center-aligned'"><span>Center-aligned</span></mdc-button>
            <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-variant-live').variant = 'medium-flexible'"><span>Medium Flexible</span></mdc-button>
            <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-variant-live').variant = 'large-flexible'"><span>Large Flexible</span></mdc-button>
            <mdc-button variant="outlined" onclick="this.getRootNode().querySelector('#demo-variant-live').variant = 'search'"><span>Search</span></mdc-button>
        </div>
        <mdc-appbar id="demo-variant-live" variant="small" headline="Interactive App Bar" subtitle="Switch variants to preview WAAPI transition">
            <mdc-icon-button slot="leading"><mdc-icon>arrow_back</mdc-icon></mdc-icon-button>
            <mdc-icon-button slot="trailing"><mdc-icon>search</mdc-icon></mdc-icon-button>
            <mdc-icon-button slot="trailing"><mdc-icon>more_vert</mdc-icon></mdc-icon-button>
        </mdc-appbar>
    </div>

    <!-- Small -->
    <mdc-appbar variant="small" headline="Small App Bar">
        <mdc-icon-button slot="leading"><mdc-icon>arrow_back</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>search</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>more_vert</mdc-icon></mdc-icon-button>
    </mdc-appbar>

    <!-- Center-aligned -->
    <mdc-appbar variant="center-aligned" headline="Centered App Bar">
        <mdc-icon-button slot="leading"><mdc-icon>arrow_back</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>more_vert</mdc-icon></mdc-icon-button>
    </mdc-appbar>

    <!-- Medium Flexible -->
    <mdc-appbar variant="medium-flexible" headline="Medium Flexible">
        <mdc-icon-button slot="leading"><mdc-icon>arrow_back</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>search</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>more_vert</mdc-icon></mdc-icon-button>
    </mdc-appbar>

    <!-- Large Flexible -->
    <mdc-appbar variant="large-flexible" headline="Large Flexible">
        <mdc-icon-button slot="leading"><mdc-icon>arrow_back</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>search</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>more_vert</mdc-icon></mdc-icon-button>
    </mdc-appbar>

    <!-- Search -->
    <mdc-appbar variant="search" headline="Search product">
        <mdc-icon-button slot="leading"><mdc-icon>menu</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>account_circle</mdc-icon></mdc-icon-button>
    </mdc-appbar>
</div>
