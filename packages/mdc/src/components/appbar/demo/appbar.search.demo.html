<div style="display: flex; flex-direction: column; gap: 24px; width: 100%;">
    <!-- 1. Linked to SearchView via `for` -->
    <mdc-appbar variant="search" headline="Search product" for="appbar-demo-search-view">
        <mdc-icon-button slot="leading"><mdc-icon>menu</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>account_circle</mdc-icon></mdc-icon-button>
    </mdc-appbar>
    <mdc-search-view id="appbar-demo-search-view" supporting-text="Search product">
        <mdc-list>
            <mdc-list-item headline="Material Design 3"></mdc-list-item>
            <mdc-list-item headline="App Bar Specs"></mdc-list-item>
            <mdc-list-item headline="Search View"></mdc-list-item>
        </mdc-list>
    </mdc-search-view>

    <!-- 2. Centered placeholder with search-trailing action -->
    <mdc-appbar variant="search" alignment="center" headline="Search emails">
        <mdc-icon-button slot="leading"><mdc-icon>menu</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="search-trailing"><mdc-icon>mic</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>account_circle</mdc-icon></mdc-icon-button>
    </mdc-appbar>

    <!-- 3. Leading element and two trailing elements outside search -->
    <mdc-appbar variant="search" headline="Search files">
        <mdc-icon-button slot="leading"><mdc-icon>menu</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>tune</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>account_circle</mdc-icon></mdc-icon-button>
    </mdc-appbar>
</div>
