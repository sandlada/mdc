<div style="display: flex; flex-direction: column; gap: 24px; width: 100%;">
    <!-- 1. Leading element and a trailing element outside search -->
    <mdc-appbar variant="search" headline="Search product">
        <mdc-icon-button slot="leading"><mdc-icon>menu</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>account_circle</mdc-icon></mdc-icon-button>
    </mdc-appbar>

    <!-- 2. Leading element, trailing inside search, and trailing outside search -->
    <mdc-appbar variant="search">
        <mdc-icon-button slot="leading"><mdc-icon>menu</mdc-icon></mdc-icon-button>
        <div slot="search" class="search-box" style="display: flex; align-items: center; width: 100%; height: 48px; background-color: var(--md-sys-color-surface-container, #ece6f0); border-radius: 9999px; padding: 0 16px; gap: 12px; box-sizing: border-box;">
            <mdc-icon style="color: var(--md-sys-color-on-surface-variant, #49454f);">search</mdc-icon>
            <span style="flex: 1; color: var(--md-sys-color-on-surface-variant, #49454f); font-size: 16px;">Search emails</span>
            <mdc-icon-button><mdc-icon>mic</mdc-icon></mdc-icon-button>
        </div>
        <mdc-icon-button slot="trailing"><mdc-icon>account_circle</mdc-icon></mdc-icon-button>
    </mdc-appbar>

    <!-- 3. Leading element and two trailing elements outside search -->
    <mdc-appbar variant="search" headline="Search files">
        <mdc-icon-button slot="leading"><mdc-icon>menu</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>tune</mdc-icon></mdc-icon-button>
        <mdc-icon-button slot="trailing"><mdc-icon>account_circle</mdc-icon></mdc-icon-button>
    </mdc-appbar>
</div>
