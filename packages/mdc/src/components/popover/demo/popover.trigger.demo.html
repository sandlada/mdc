<mdc-popover trigger="click">
    <mdc-button slot="trigger"><span>Click Trigger</span></mdc-button>
    <p>Opens on click and dismisses on outside click or Escape.</p>
</mdc-popover>

<mdc-popover trigger="hover" show-delay="150" hide-delay="150">
    <mdc-button slot="trigger" variant="outlined"><span>Hover Trigger</span></mdc-button>
    <p>Opens on pointer hover or keyboard focus.</p>
</mdc-popover>
