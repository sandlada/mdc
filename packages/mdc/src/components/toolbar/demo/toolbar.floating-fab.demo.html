<!-- Floating Toolbar with Paired FAB -->
<mdc-floating-toolbar variant="standard" aria-label="Compose actions">
    <mdc-icon-button aria-label="Attach"><mdc-icon>attach_file</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Image"><mdc-icon>image</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="More"><mdc-icon>more_vert</mdc-icon></mdc-icon-button>
    <mdc-fab slot="fab" open aria-label="Create">
        <mdc-icon slot="icon">add</mdc-icon>
    </mdc-fab>
</mdc-floating-toolbar>
