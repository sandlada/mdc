<!-- Standard Horizontal Floating Toolbar -->
<mdc-floating-toolbar variant="standard" aria-label="Quick actions">
    <mdc-icon-button aria-label="Format Bold"><mdc-icon>format_bold</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Format Italic"><mdc-icon>format_italic</mdc-icon></mdc-icon-button>
    <mdc-icon-button variant="filled-tonal" togglable selected aria-label="Align Left"><mdc-icon>format_align_left</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Link"><mdc-icon>link</mdc-icon></mdc-icon-button>
</mdc-floating-toolbar>

<!-- Vibrant Horizontal Floating Toolbar -->
<mdc-floating-toolbar variant="vibrant" aria-label="Media controls">
    <mdc-icon-button aria-label="Previous"><mdc-icon>skip_previous</mdc-icon></mdc-icon-button>
    <mdc-icon-button variant="filled-tonal" togglable selected aria-label="Play"><mdc-icon>play_arrow</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Next"><mdc-icon>skip_next</mdc-icon></mdc-icon-button>
</mdc-floating-toolbar>
