<!-- Vertical Floating Toolbar -->
<mdc-floating-toolbar orientation="vertical" variant="standard" aria-label="Canvas tools">
    <mdc-icon-button variant="filled-tonal" togglable selected aria-label="Select"><mdc-icon>near_me</mdc-icon></mdc-icon-button>
    <mdc-icon-button variant="filled-tonal" togglable aria-label="Draw"><mdc-icon>draw</mdc-icon></mdc-icon-button>
    <mdc-icon-button variant="filled-tonal" togglable aria-label="Shapes"><mdc-icon>category</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Text"><mdc-icon>title</mdc-icon></mdc-icon-button>
</mdc-floating-toolbar>

<!-- Vertical Vibrant Floating Toolbar with Paired FAB -->
<mdc-floating-toolbar orientation="vertical" variant="vibrant" aria-label="Vertical actions">
    <mdc-icon-button aria-label="Zoom In"><mdc-icon>zoom_in</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Zoom Out"><mdc-icon>zoom_out</mdc-icon></mdc-icon-button>
    <mdc-fab slot="fab" open aria-label="Add Layer">
        <mdc-icon slot="icon">add</mdc-icon>
    </mdc-fab>
</mdc-floating-toolbar>
