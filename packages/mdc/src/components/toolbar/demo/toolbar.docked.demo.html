<!-- Standard Docked Toolbar -->
<mdc-docked-toolbar variant="standard" aria-label="Document actions">
    <mdc-icon-button aria-label="Add"><mdc-icon>add</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Edit"><mdc-icon>edit</mdc-icon></mdc-icon-button>
    <mdc-icon-button variant="filled-tonal" togglable selected aria-label="Favorite"><mdc-icon>favorite</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Share"><mdc-icon>share</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="More"><mdc-icon>more_vert</mdc-icon></mdc-icon-button>
</mdc-docked-toolbar>

<!-- Vibrant Docked Toolbar -->
<mdc-docked-toolbar variant="vibrant" aria-label="Editing mode actions">
    <mdc-icon-button aria-label="Undo"><mdc-icon>undo</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Redo"><mdc-icon>redo</mdc-icon></mdc-icon-button>
    <mdc-icon-button variant="filled-tonal" togglable selected aria-label="Bold"><mdc-icon>format_bold</mdc-icon></mdc-icon-button>
    <mdc-icon-button variant="filled-tonal" togglable aria-label="Italic"><mdc-icon>format_italic</mdc-icon></mdc-icon-button>
    <mdc-icon-button aria-label="Done"><mdc-icon>check</mdc-icon></mdc-icon-button>
</mdc-docked-toolbar>
