<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
    <mdc-shape
        interactive
        toggle
        shape="square"
        hover-shape="cookie-4-sided"
        focus-shape="pentagon"
        pressed-shape="soft-burst"
        selected-shape="heart"
        motion-scheme="expressive"
        motion-speed="fast"
        variant="filled"
        color="primary"
        size="large"
        aria-label="Toggle favorite shape"
    >
        <mdc-icon name="favorite"></mdc-icon>
    </mdc-shape>

    <mdc-shape
        interactive
        toggle
        shape="circle"
        hover-shape="clover-4-leaf"
        pressed-shape="sunny"
        selected-shape="flower"
        motion-scheme="expressive"
        motion-speed="default"
        variant="tonal"
        color="secondary"
        size="large"
        aria-label="Toggle bookmark shape"
    >
        <mdc-icon name="star"></mdc-icon>
    </mdc-shape>

    <mdc-shape
        interactive
        toggle
        shape="pill"
        hover-shape="gem"
        pressed-shape="diamond"
        selected-shape="cookie-9-sided"
        motion-scheme="standard"
        motion-speed="fast"
        variant="outlined"
        color="tertiary"
        size="large"
        aria-label="Standard motion scheme toggle"
    >
        <mdc-icon name="bolt"></mdc-icon>
    </mdc-shape>

    <mdc-shape
        interactive
        disabled
        shape="square"
        disabled-shape="circle"
        variant="filled"
        size="large"
        aria-label="Disabled shape"
    >
        <mdc-icon name="block"></mdc-icon>
    </mdc-shape>
</div>
