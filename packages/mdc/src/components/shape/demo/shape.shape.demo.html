<div style="display: flex; flex-direction: column; gap: 20px; width: 100%;">
    <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
        <mdc-shape
            id="gallery-hero"
            shape="circle"
            variant="tonal"
            color="primary"
            motion-scheme="expressive"
            motion-speed="fast"
            style="width: 112px; height: 112px;"
        ></mdc-shape>
        <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="font-weight: 600;">35 Jetpack Compose MaterialShapes</div>
            <div style="font-size: 13px; opacity: 0.78;">
                Click any shape below to morph with an underdamped Expressive spring:
                <code id="gallery-active-name">circle</code>
            </div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px;">
        <mdc-shape interactive shape="circle" variant="surface" size="medium" title="circle" onclick="const r = this.getRootNode(); r.querySelector('#gallery-hero').shape = 'circle'; r.querySelector('#gallery-active-name').textContent = 'circle';"></mdc-shape>
        <mdc-shape interactive shape="square" variant="surface" size="medium" title="square" onclick="const r = this.getRootNode(); r.querySelector('#gallery-hero').shape = 'square'; r.querySelector('#gallery-active-name').textContent = 'square';"></mdc-shape>
