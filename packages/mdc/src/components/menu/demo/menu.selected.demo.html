<style>
    .demo-column {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px;
        max-width: 480px;
    }

    .demo-caption {
        font-size: 12px;
        color: #757575;
    }
</style>

<div class="demo-column">
    <span class="demo-caption">selected — highlighted row (set the `selected` attribute):</span>
    <mdc-menu label="Selected item">
        <mdc-button variant="outlined" slot="trigger"><span>Open menu</span></mdc-button>
        <mdc-menu-item type="button">
            <mdc-icon slot="leading">inbox</mdc-icon>
            <span>Inbox</span>
        </mdc-menu-item>
        <mdc-menu-item type="button" selected>
            <mdc-icon slot="leading">outbox</mdc-icon>
            <span>Outbox</span>
        </mdc-menu-item>
        <mdc-menu-item type="button">
            <mdc-icon slot="leading">star</mdc-icon>
            <span>Starred</span>
        </mdc-menu-item>
    </mdc-menu>
</div>

<div class="demo-column">
    <span class="demo-caption">Selected item with supporting text:</span>
    <mdc-menu label="Selected two-line">
        <mdc-button variant="outlined" slot="trigger"><span>Open menu</span></mdc-button>
        <mdc-menu-item type="button" selected>
            <mdc-icon slot="leading">folder</mdc-icon>
            <span>Documents</span>
            <span slot="supporting">12 files</span>
        </mdc-menu-item>
        <mdc-menu-item type="button">
            <mdc-icon slot="leading">photo</mdc-icon>
            <span>Images</span>
            <span slot="supporting">8 files</span>
        </mdc-menu-item>
    </mdc-menu>
</div>
