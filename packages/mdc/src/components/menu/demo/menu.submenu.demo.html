<style>
    .demo-column {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px;
        max-width: 480px;
    }

    .demo-caption {
        font-size: 12px;
        color: #757575;
    }
</style>

<div class="demo-column">
    <span class="demo-caption">Submenu nesting — nested surface at `right-start` (mirrored in RTL), Right / Enter opens, Left / Escape closes:</span>
    <mdc-menu open label="Menu with submenu">
        <button slot="trigger">Open menu</button>
        <mdc-menu-item type="button">New file</mdc-menu-item>
        <mdc-menu-submenu label="Share" placement="right-start">
            <mdc-menu-item type="button">Email</mdc-menu-item>
            <mdc-menu-item type="button">Copy link</mdc-menu-item>
            <mdc-menu-item type="button">Embed</mdc-menu-item>
        </mdc-menu-submenu>
        <mdc-menu-item type="button">Download</mdc-menu-item>
    </mdc-menu>
</div>

<div class="demo-column">
    <span class="demo-caption">Open submenu — `open` shows the nested surface; `disabled` disables the trigger:</span>
    <mdc-menu open label="Open submenu">
        <button slot="trigger">Open menu</button>
        <mdc-menu-item type="button">New file</mdc-menu-item>
        <mdc-menu-submenu label="Share" placement="right-start" open>
            <mdc-menu-item type="button">Email</mdc-menu-item>
            <mdc-menu-item type="button">Copy link</mdc-menu-item>
        </mdc-menu-submenu>
        <mdc-menu-submenu label="Export (unavailable)" disabled>
            <mdc-menu-item type="button">PDF</mdc-menu-item>
            <mdc-menu-item type="button">PNG</mdc-menu-item>
        </mdc-menu-submenu>
    </mdc-menu>
</div>
