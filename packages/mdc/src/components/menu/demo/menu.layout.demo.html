<style>
    .demo-column {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px;
        max-width: 480px;
    }

    .demo-caption {
        font-size: 12px;
        color: #757575;
    }
</style>

<div class="demo-column">
    <span class="demo-caption">layout="standard" — single flat item list (default):</span>
    <mdc-menu layout="standard" label="Standard layout">
        <mdc-button variant="outlined" slot="trigger"><span>Open menu</span></mdc-button>
        <mdc-menu-item type="button">Cut</mdc-menu-item>
        <mdc-menu-item type="button">Copy</mdc-menu-item>
        <mdc-menu-item type="button">Paste</mdc-menu-item>
    </mdc-menu>
</div>

<div class="demo-column">
    <span class="demo-caption">layout="grouped" — grouped surfaces using `mdc-menu-group` with 4dp gap separation and outer/inner corner radii:</span>
    <mdc-menu layout="grouped" label="Grouped layout">
        <mdc-button variant="outlined" slot="trigger"><span>Open grouped</span></mdc-button>
        <mdc-menu-group label="Recent">
            <mdc-menu-item type="button">
                <mdc-icon slot="leading">description</mdc-icon>
                <span>Report.docx</span>
            </mdc-menu-item>
            <mdc-menu-item type="button">
                <mdc-icon slot="leading">notes</mdc-icon>
                <span>Notes.txt</span>
            </mdc-menu-item>
        </mdc-menu-group>
        <mdc-menu-group label="Shared">
            <mdc-menu-item type="button">
                <mdc-icon slot="leading">table_chart</mdc-icon>
                <span>Budget.xlsx</span>
            </mdc-menu-item>
            <mdc-menu-item type="button">
                <mdc-icon slot="leading">slideshow</mdc-icon>
                <span>Deck.pptx</span>
            </mdc-menu-item>
        </mdc-menu-group>
    </mdc-menu>
</div>
