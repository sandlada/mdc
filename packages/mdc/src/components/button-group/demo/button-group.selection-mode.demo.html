<!-- None (Action Group) -->
<mdc-button-group selection-mode="none">
    <mdc-button variant="filled">Action 1</mdc-button>
    <mdc-button variant="filled">Action 2</mdc-button>
    <mdc-button variant="filled">Action 3</mdc-button>
</mdc-button-group>

<!-- Single (Radio Mutex) -->
<mdc-button-group selection-mode="single">
    <mdc-toggle-button variant="filled-tonal" checked>Single 1</mdc-toggle-button>
    <mdc-toggle-button variant="filled-tonal">Single 2</mdc-toggle-button>
    <mdc-toggle-button variant="filled-tonal">Single 3</mdc-toggle-button>
</mdc-button-group>

<!-- Multiple (Checkbox Semantics) -->
<mdc-button-group selection-mode="multiple">
    <mdc-toggle-button variant="outlined" checked>Multi A</mdc-toggle-button>
    <mdc-toggle-button variant="outlined" checked>Multi B</mdc-toggle-button>
    <mdc-toggle-button variant="outlined">Multi C</mdc-toggle-button>
</mdc-button-group>
