<!-- None (Action Group) -->
<mdc-button-group selection-mode="none">
    <mdc-button variant="filled"><span>Action 1</span></mdc-button>
    <mdc-button variant="filled"><span>Action 2</span></mdc-button>
    <mdc-button variant="filled"><span>Action 3</span></mdc-button>
</mdc-button-group>

<!-- Single (Radio Mutex) -->
<mdc-button-group selection-mode="single">
    <mdc-toggle-button variant="filled-tonal" checked><span>Single 1</span></mdc-toggle-button>
    <mdc-toggle-button variant="filled-tonal"><span>Single 2</span></mdc-toggle-button>
    <mdc-toggle-button variant="filled-tonal"><span>Single 3</span></mdc-toggle-button>
</mdc-button-group>

<!-- Multiple (Checkbox Semantics) -->
<mdc-button-group selection-mode="multiple">
    <mdc-toggle-button variant="outlined" checked><span>Multi A</span></mdc-toggle-button>
    <mdc-toggle-button variant="outlined" checked><span>Multi B</span></mdc-toggle-button>
    <mdc-toggle-button variant="outlined"><span>Multi C</span></mdc-toggle-button>
</mdc-button-group>
