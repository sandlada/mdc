<!-- Label Buttons with Icons (M3 Spec Layout 1) -->
<mdc-button-group variant="standard">
    <mdc-button variant="filled-tonal">
        <mdc-icon slot="icon">directions_car</mdc-icon>
        Start
    </mdc-button>
    <mdc-button variant="filled-tonal">
        <mdc-icon slot="icon">directions</mdc-icon>
        Directions
    </mdc-button>
    <mdc-button variant="filled-tonal">
        <mdc-icon slot="icon">share</mdc-icon>
        Share
    </mdc-button>
</mdc-button-group>

<!-- Mixed Label and Icon Buttons (M3 Spec Layout 2) -->
<mdc-button-group variant="standard">
    <mdc-icon-button variant="filled">
        <mdc-icon>fast_rewind</mdc-icon>
    </mdc-icon-button>
    <mdc-button variant="filled">
        <mdc-icon slot="icon">play_arrow</mdc-icon>
        Play
    </mdc-button>
    <mdc-icon-button variant="filled">
        <mdc-icon>fast_forward</mdc-icon>
    </mdc-icon-button>
</mdc-button-group>

<!-- Connected Mixed Group -->
<mdc-button-group variant="connected">
    <mdc-button variant="filled">
        <mdc-icon slot="icon">edit</mdc-icon>
        Edit
    </mdc-button>
    <mdc-icon-button variant="filled">
        <mdc-icon>arrow_drop_down</mdc-icon>
    </mdc-icon-button>
</mdc-button-group>
