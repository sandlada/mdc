<!-- Standard Icon Button Group (M3 Common Layout) -->
<mdc-button-group variant="standard" selection-mode="single">
    <mdc-toggle-icon-button variant="filled-tonal" checked>
        <mdc-icon>bluetooth</mdc-icon>
    </mdc-toggle-icon-button>
    <mdc-toggle-icon-button variant="filled-tonal">
        <mdc-icon>schedule</mdc-icon>
    </mdc-toggle-icon-button>
    <mdc-toggle-icon-button variant="filled-tonal">
        <mdc-icon>link</mdc-icon>
    </mdc-toggle-icon-button>
    <mdc-toggle-icon-button variant="filled-tonal">
        <mdc-icon>wifi</mdc-icon>
    </mdc-toggle-icon-button>
</mdc-button-group>

<!-- Connected Icon Button Group -->
<mdc-button-group variant="connected" selection-mode="single">
    <mdc-toggle-icon-button variant="filled" checked>
        <mdc-icon>bluetooth</mdc-icon>
    </mdc-toggle-icon-button>
    <mdc-toggle-icon-button variant="filled">
        <mdc-icon>schedule</mdc-icon>
    </mdc-toggle-icon-button>
    <mdc-toggle-icon-button variant="filled">
        <mdc-icon>link</mdc-icon>
    </mdc-toggle-icon-button>
    <mdc-toggle-icon-button variant="filled">
        <mdc-icon>wifi</mdc-icon>
    </mdc-toggle-icon-button>
</mdc-button-group>
