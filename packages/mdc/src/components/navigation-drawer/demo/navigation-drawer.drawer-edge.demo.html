        <mdc-icon slot="inactive-icon">menu</mdc-icon>

    <mdc-navigation-tab name="edge-tabs-1" value="/start-2" label="Start Item 2">
        <mdc-icon slot="inactive-icon">menu_open</mdc-icon>
