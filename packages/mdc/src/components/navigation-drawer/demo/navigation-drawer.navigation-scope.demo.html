<!-- Synchronized Navigation Drawer in shared scope -->
<mdc-navigation-drawer variant="standard" open headline="Drawer A" navigation-scope="sync-scope">
    <mdc-navigation-tab name="sync-tabs" value="/dashboard" checked label="Dashboard">
        <mdc-icon slot="inactive-icon">dashboard</mdc-icon>
        <mdc-icon slot="active-icon" filled>dashboard</mdc-icon>
    </mdc-navigation-tab>
    <mdc-navigation-tab name="sync-tabs" value="/messages" label="Messages">
        <mdc-icon slot="inactive-icon">mail</mdc-icon>
        <mdc-icon slot="active-icon" filled>mail</mdc-icon>
    </mdc-navigation-tab>
    <mdc-navigation-tab name="sync-tabs" value="/profile" label="Profile">
        <mdc-icon slot="inactive-icon">person</mdc-icon>
        <mdc-icon slot="active-icon" filled>person</mdc-icon>
    </mdc-navigation-tab>
</mdc-navigation-drawer>
