<mdc-date-picker id="date-variant-modal" variant="modal" selection="single" supporting-text="Select date"></mdc-date-picker>
<mdc-button variant="filled" onclick="this.getRootNode().querySelector('#date-variant-modal').show()"><span>Open modal picker</span></mdc-button>
<mdc-date-picker id="date-variant-docked" variant="docked" selection="single" supporting-text="Select date"></mdc-date-picker>
<mdc-date-picker id="date-variant-input" variant="modal" display-mode="input" selection="single" supporting-text="Select date"></mdc-date-picker>
<mdc-button variant="filled" onclick="this.getRootNode().querySelector('#date-variant-input').show()"><span>Open input picker</span></mdc-button>
<mdc-date-picker id="date-variant-fullscreen" variant="fullscreen" selection="range" supporting-text="Depart - Return dates"></mdc-date-picker>
<mdc-button variant="filled" onclick="this.getRootNode().querySelector('#date-variant-fullscreen').show()"><span>Open fullscreen range</span></mdc-button>
