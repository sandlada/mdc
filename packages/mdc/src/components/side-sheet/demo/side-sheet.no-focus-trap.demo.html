<mdc-side-sheet variant="modal" no-focus-trap open>
    <span slot="headline">No focus trap</span>
    <p>Tab moves through the page despite the open sheet.</p>
</mdc-side-sheet>

<mdc-side-sheet variant="modal" open>
    <span slot="headline">Traps focus (default)</span>
    <p>Tab is constrained to the sheet.</p>
</mdc-side-sheet>
