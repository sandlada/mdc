<mdc-side-sheet id="ss-draggable-on" variant="modal" draggable>
    <span slot="headline">Draggable (default)</span>
    <p>Swipe horizontally towards the viewport edge to dismiss.</p>
</mdc-side-sheet>

<mdc-side-sheet id="ss-draggable-off" variant="modal" draggable="false">
    <span slot="headline">Not draggable</span>
    <p>Horizontal swipe gesture is disabled.</p>
</mdc-side-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#ss-draggable-on').show()"><span>Draggable</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#ss-draggable-off').show()"><span>Not draggable</span></mdc-button>
