<mdc-side-sheet id="ss-variant-standard" variant="standard">
    <span slot="headline">Standard</span>
    <p>Co-exists with the page: no scrim, and the rest of the UI stays interactive.</p>
</mdc-side-sheet>

<mdc-side-sheet id="ss-variant-modal" variant="modal">
    <span slot="headline">Modal</span>
    <p>Blocks the page behind a scrim until dismissed.</p>
</mdc-side-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#ss-variant-standard').show()"><span>Standard</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#ss-variant-modal').show()"><span>Modal</span></mdc-button>
