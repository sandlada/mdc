<mdc-side-sheet id="ss-handle-open-only" variant="standard" handle-mode="open-only" draggable>
    <span slot="headline">Open-only (default)</span>
    <p>The top handle exists on the open sheet only; a closed sheet exposes nothing.</p>
</mdc-side-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#ss-handle-open-only').show()"><span>Open</span></mdc-button>
