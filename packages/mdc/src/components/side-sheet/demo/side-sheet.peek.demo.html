<mdc-side-sheet id="ss-handle-peek" variant="standard" handle-mode="peek" draggable>
    <span slot="headline">Peek</span>
    <p>A closed sheet keeps only a vertical grip docked at the edge — drag it to pull the sheet out or push it back. Drag it across the viewport midline to relocate the sheet to the opposite edge.</p>
</mdc-side-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#ss-handle-peek').show()"><span>Open</span></mdc-button>
