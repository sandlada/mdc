<mdc-side-sheet id="ss-headline-with" variant="modal">
    <span slot="headline">Headline text</span>
    <p>Body content.</p>
</mdc-side-sheet>

<mdc-side-sheet id="ss-headline-without" variant="modal">
    <p>No headline; the title row still renders with an empty leading slot.</p>
</mdc-side-sheet>

<mdc-button onclick="this.getRootNode().querySelector('#ss-headline-with').show()"><span>With headline</span></mdc-button>
<mdc-button onclick="this.getRootNode().querySelector('#ss-headline-without').show()"><span>Without headline</span></mdc-button>
