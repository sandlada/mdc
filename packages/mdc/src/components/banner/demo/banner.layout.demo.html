<div style="display: flex; flex-direction: column; gap: 16px;">
    <mdc-banner layout="single-line" icon="cloud_off" primary-action="Retry">
        Single-line layout keeps icon, message, and action on one horizontal row.
    </mdc-banner>

    <mdc-banner layout="stacked" icon="system_update" headline="Update available" primary-action="Update now" secondary-action="Later">
        Stacked layout places actions on a right-aligned row beneath the message.
    </mdc-banner>

    <mdc-banner layout="auto" icon="warning" primary-action="Review" secondary-action="Dismiss">
        Auto layout switches to stacked automatically when two actions or a headline are present, or on narrow screens.
    </mdc-banner>
</div>
