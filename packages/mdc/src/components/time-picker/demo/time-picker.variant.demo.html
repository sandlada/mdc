<mdc-time-picker id="time-variant-dial" variant="dial" orientation="vertical" headline="Select time"></mdc-time-picker>
<mdc-button variant="filled" onclick="this.getRootNode().querySelector('#time-variant-dial').show()"><span>Open dial picker</span></mdc-button>
<mdc-time-picker id="time-variant-input" variant="input" orientation="vertical" headline="Select time"></mdc-time-picker>
<mdc-button variant="filled" onclick="this.getRootNode().querySelector('#time-variant-input').show()"><span>Open input picker</span></mdc-button>
