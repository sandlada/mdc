<mdc-data-table id="dt-loading" loading title="Loading State"></mdc-data-table>
<mdc-data-table id="dt-empty" title="Empty State" empty-text="No matching desserts found."></mdc-data-table>
<script type="module">
    const columns = [
        { key: 'name', label: 'Dessert' },
        { key: 'calories', label: 'Calories', numeric: true },
    ]
    const loadingEl = document.getElementById('dt-loading')
    if (loadingEl) {
        loadingEl.columns = columns
        loadingEl.rows = [
            { id: '1', name: 'Frozen yogurt', calories: 159 },
            { id: '2', name: 'Eclair', calories: 262 },
        ]
    }
    const emptyEl = document.getElementById('dt-empty')
    if (emptyEl) {
        emptyEl.columns = columns
        emptyEl.rows = []
    }
</script>
