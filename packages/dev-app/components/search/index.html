<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Bar — MDC Docs</title>
    <script type="module" src="/shared/theme.ts"></script>
    <script type="module" src="/shared/docs-page.ts"></script>
    <script type="module">
        import '@sandlada/mdc/components/search/search-bar'
        import '@sandlada/mdc/components/icon/icon'
    </script>
    <link rel="stylesheet" href="https://esm.sh/material-symbols@latest" />
    <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
    <mdc-docs-page component="search" title="Search Bar" subtitle="Search input with avatar / leading / trailing icon slots and supporting text.">
        <section>
            <h2>Variants</h2>
            <div class="demo-frame">
                <mdc-search-bar supporting-text="Type here to search">
                    <mdc-icon slot="trailing-icon" name="search"></mdc-icon>
                </mdc-search-bar>
                <mdc-search-bar supporting-text="Type here to search">
                    <mdc-icon slot="avatar" name="search"></mdc-icon>
                </mdc-search-bar>
                <mdc-search-bar supporting-text="Type here to search" hide-avatar>
                    <mdc-icon slot="leading-icon" name="search"></mdc-icon>
                    <mdc-icon slot="trailing-icon" name="search"></mdc-icon>
                </mdc-search-bar>
            </div>
        </section>
    </mdc-docs-page>
</body>
</html>
