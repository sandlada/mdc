<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon Button — MDC Docs</title>
    <script type="module" src="/shared/theme.ts"></script>
    <script type="module" src="/shared/docs-page.ts"></script>
    <script type="module">
        import '@sandlada/mdc/components/icon-button/icon-button'
        import '@sandlada/mdc/components/icon-button/toggle-icon-button'
        import '@sandlada/mdc/components/icon/icon'
    </script>
    <link rel="stylesheet" href="https://esm.sh/material-symbols@latest" />
    <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
    <mdc-docs-page component="icon-button" title="Icon Button" subtitle="Compact round / square button with an icon slot. Toggle variant supports radio / checkbox.">
        <section>
            <h2>Variants</h2>
            <div class="demo-frame">
                <mdc-icon-button variant="filled"><mdc-icon>delete</mdc-icon></mdc-icon-button>
                <mdc-icon-button variant="filled-tonal"><mdc-icon>delete</mdc-icon></mdc-icon-button>
                <mdc-icon-button variant="outlined"><mdc-icon>delete</mdc-icon></mdc-icon-button>
                <mdc-icon-button><mdc-icon>delete</mdc-icon></mdc-icon-button>
            </div>
        </section>
        <section>
            <h2>Toggle</h2>
            <div class="demo-frame">
                <mdc-toggle-icon-button variant="filled"><mdc-icon>delete</mdc-icon></mdc-toggle-icon-button>
                <mdc-toggle-icon-button variant="filled" disabled><mdc-icon>delete</mdc-icon></mdc-toggle-icon-button>
            </div>
        </section>
    </mdc-docs-page>
</body>
</html>
