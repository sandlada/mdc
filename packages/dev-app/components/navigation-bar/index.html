<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar — MDC Docs</title>
    <script type="module" src="/shared/theme.ts"></script>
    <script type="module" src="/shared/docs-page.ts"></script>
    <script type="module">
        import '@sandlada/mdc/components/navigation-bar/navigation-bar'
        import '@sandlada/mdc/components/navigation-tab/navigation-tab'
        import '@sandlada/mdc/components/icon/icon'
    </script>
    <link rel="stylesheet" href="https://esm.sh/material-symbols@latest" />
    <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
    <mdc-docs-page component="navigation-bar" title="Navigation Bar" subtitle="Top / bottom navigation container. Holds navigation-tab children.">
        <section>
            <h2>Horizontal</h2>
            <div class="demo-frame">
                <mdc-navigation-bar open>
                    <mdc-navigation-tab name="nb1" value="/" checked label="Home" variant="bar-horizontal">
                        <mdc-icon slot="inactive-icon">send</mdc-icon>
                        <mdc-icon slot="active-icon" filled>send</mdc-icon>
                    </mdc-navigation-tab>
                    <mdc-navigation-tab name="nb1" value="/profile" label="Profile" variant="bar-horizontal">
                        <mdc-icon slot="inactive-icon">send</mdc-icon>
                        <mdc-icon slot="active-icon" filled>send</mdc-icon>
                    </mdc-navigation-tab>
                    <mdc-navigation-tab name="nb1" value="/settings" label="Settings" variant="bar-horizontal">
                        <mdc-icon slot="inactive-icon">send</mdc-icon>
                        <mdc-icon slot="active-icon" filled>send</mdc-icon>
                    </mdc-navigation-tab>
                </mdc-navigation-bar>
            </div>
        </section>
    </mdc-docs-page>
</body>
</html>
