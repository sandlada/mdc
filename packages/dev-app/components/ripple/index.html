<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ripple — MDC Docs</title>
    <script type="module" src="/shared/theme.ts"></script>
    <script type="module" src="/shared/docs-page.ts"></script>
    <script type="module">
        import '@sandlada/mdc/components/ripple/ripple'
        import '@sandlada/mdc/components/elevation/elevation'
        import '@sandlada/mdc/components/focus-ring/focus-ring'
    </script>
    <link rel="stylesheet" href="https://esm.sh/material-symbols@latest" />
    <link rel="stylesheet" href="/shared/styles.css" />
    <style>
        .ripple-cell {
            position: relative;
            height: 48px;
            width: 56px;
            box-sizing: border-box;
            border: 1px solid black;
            vertical-align: top;
            margin: 4px;
            --mdc-elevation-level: 3;
        }
        .ripple-cell:hover {
            --mdc-elevation-level: 5;
        }
        .ripple-button {
            position: relative;
            border: none;
            outline: none;
            background: #86efac;
            padding: 8px 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <mdc-docs-page component="ripple" title="Ripple" subtitle="Material ripple effect. Attach to any element by placing it as a child or via `for=...`.">
        <section>
            <h2>Container ripple</h2>
            <div class="demo-frame">
                <div class="ripple-cell" tabindex="0">
                    <mdc-ripple></mdc-ripple>
                    <mdc-elevation></mdc-elevation>
                    <mdc-focus-ring></mdc-focus-ring>
                </div>
                <div class="ripple-cell" tabindex="0">
                    <mdc-ripple ignore-global-config></mdc-ripple>
                    <mdc-elevation></mdc-elevation>
                    <mdc-focus-ring></mdc-focus-ring>
                </div>
            </div>
        </section>
        <section>
            <h2>Detached ripple (for=...)</h2>
            <div class="demo-frame">
                <button class="ripple-button">
                    Click Me
                    <mdc-ripple id="docs-ripple-1"></mdc-ripple>
                </button>
                <div id="docs-ripple-target" class="ripple-cell" tabindex="0">Target</div>
                <button class="ripple-button">
                    Trigger target
                    <mdc-ripple for="docs-ripple-target"></mdc-ripple>
                </button>
            </div>
        </section>
    </mdc-docs-page>
</body>
</html>
