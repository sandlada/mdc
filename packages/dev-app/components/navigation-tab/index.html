<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Tab — MDC Docs</title>
    <script type="module" src="/shared/theme.ts"></script>
    <script type="module" src="/shared/docs-page.ts"></script>
    <script type="module">
        import '@sandlada/mdc/components/navigation-tab/navigation-tab'
        import '@sandlada/mdc/components/navigation-bar/navigation-bar'
        import '@sandlada/mdc/components/navigation-rail/navigation-rail'
        import '@sandlada/mdc/components/icon/icon'
    </script>
    <link rel="stylesheet" href="https://esm.sh/material-symbols@latest" />
    <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
    <mdc-docs-page component="navigation-tab" title="Navigation Tab" subtitle="A single nav tab. Pair with <mdc-navigation-bar> or <mdc-navigation-rail>.">
        <section>
            <h2>Inside a navigation-bar</h2>
            <div class="demo-frame">
                <mdc-navigation-bar open>
                    <mdc-navigation-tab name="docs-navtab" value="/" checked label="Home">
                        <mdc-icon slot="inactive-icon">send</mdc-icon>
                        <mdc-icon slot="active-icon" filled>send</mdc-icon>
                    </mdc-navigation-tab>
                    <mdc-navigation-tab name="docs-navtab" value="/profile" label="Profile">
                        <mdc-icon slot="inactive-icon">send</mdc-icon>
                        <mdc-icon slot="active-icon" filled>send</mdc-icon>
                    </mdc-navigation-tab>
                    <mdc-navigation-tab name="docs-navtab" value="/settings" label="Settings">
                        <mdc-icon slot="inactive-icon">send</mdc-icon>
                        <mdc-icon slot="active-icon" filled>send</mdc-icon>
                    </mdc-navigation-tab>
                </mdc-navigation-bar>
            </div>
        </section>
    </mdc-docs-page>
</body>
</html>
